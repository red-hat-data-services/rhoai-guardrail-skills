# kube-linter configuration — ATTRIBUTED BASELINE, ADAPT BEFORE PROPOSING
#
# Attribution: OpenDataHub operator `.kube-linter.yaml`
#   https://raw.githubusercontent.com/opendatahub-io/opendatahub-operator/4558b26044ce3ed76719e6fb3461357decb5a0b6/.kube-linter.yaml
#   revision 4558b26044ce3ed76719e6fb3461357decb5a0b6 (2026-01-22)
#
# This file is a CANDIDATE STARTING POINT, not a policy to copy verbatim.
# Before proposing it to a consumer repository:
#   1. Justify every included check from the repository's actual manifests.
#   2. Justify every check you omit, disable, or customize — "it fails" is not
#      a rationale; never tune to green.
#   3. Preserve any existing consumer kube-linter checks, custom checks, and
#      annotations; merge rather than replace.
#   4. The category comments below (including CIS benchmark references) are
#      the source project's policy intentions. They are not proof of
#      compliance, and adopting this config is not a CIS/RHAI certification.
#   5. Record the adapted config's rationale in the assessment report's
#      check-selection matrix.
#
# Validated against kube-linter v0.8.3 (module golang.stackrox.io/kube-linter).

checks:
  # Default checks are not automatically added; only the explicit list below runs.
  doNotAutoAddDefaults: true
  # All built-ins are not added; omissions are deliberate, per check.
  addAllBuiltIn: false

  include:
    # ===========================================================================
    # CONTAINER SECURITY - Privilege & Isolation
    # ===========================================================================
    # Prevents containers from running with excessive privileges that could
    # enable container escapes and node compromise
    - "privileged-container"              # No privileged mode (bypasses all security)
    - "privilege-escalation-container"    # Prevent allowPrivilegeEscalation=true
    - "run-as-non-root"                   # Enforce runAsNonRoot (CWE-250)
    - "host-network"                      # No host network namespace sharing
    - "host-pid"                          # No host PID namespace sharing
    - "host-ipc"                          # No host IPC namespace sharing
    - "docker-sock"                       # No docker.sock mount (container escape)
    - "sensitive-host-mounts"             # No mounting /, /etc, /sys, /proc, etc.
    - "writable-host-mount"               # Host mounts must be readOnly
    - "no-read-only-root-fs"              # Enforce readOnlyRootFilesystem
    - "drop-net-raw-capability"           # Drop NET_RAW (packet crafting)
    - "unsafe-proc-mount"                 # Prevent procMount=Unmasked
    - "unsafe-sysctls"                    # Block dangerous sysctls

    # ===========================================================================
    # RBAC & ACCESS CONTROL
    # ===========================================================================
    # The source project maps these to CIS Kubernetes Benchmark recommendations.
    # For operators — especially module operators that install operands —
    # findings here are RISK SIGNALS to explain with manifest evidence, not
    # automatic defects. Never blanket-exempt operator RBAC; see
    # recipes/module-operator.md for containment analysis.
    - "cluster-admin-role-binding"        # CIS 5.1.1: Restrict cluster-admin
    - "access-to-secrets"                 # CIS 5.1.2: Limit secret access
    - "wildcard-in-rules"                 # CIS 5.1.3: No wildcards in RBAC
    - "access-to-create-pods"             # CIS 5.1.4: Restrict pod creation
    - "no-system-group-binding"           # Custom check, defined below
    - "sa-subject-namespace"              # Custom check, defined below
    - "sa-subject-exists"                 # Custom check, defined below

    # ===========================================================================
    # SECRET MANAGEMENT
    # ===========================================================================
    # Prevents secret exposure through environment variables (visible in logs,
    # crashes, and process listings)
    - "env-var-secret"                    # No secrets in env vars (use secretKeyRef)
    - "read-secret-from-env-var"          # CIS 5.4.1: Prefer mounted secrets

    # ===========================================================================
    # SERVICE ACCOUNT SECURITY
    # ===========================================================================
    - "default-service-account"           # Don't use default SA (create dedicated)
    - "non-existent-service-account"      # Validate SA exists

    # ===========================================================================
    # NETWORK SECURITY
    # ===========================================================================
    - "privileged-ports"                  # No ports < 1024 (require root)
    - "ssh-port"                          # Flag SSH exposure (port 22)
    - "exposed-services"                  # No NodePort/LoadBalancer (use Ingress)
    - "non-isolated-pod"                  # Require NetworkPolicy

    # ===========================================================================
    # RELIABILITY & AVAILABILITY
    # ===========================================================================
    - "no-liveness-probe"                 # Require liveness probes
    - "no-readiness-probe"                # Require readiness probes
    # Probe ports must be declared by the container (container.ports). The API
    # accepts probes targeting undeclared ports — runtime-works-today,
    # nothing-cross-checks-it. Fires on the feast operator manager container
    # (probes target 8081; the kubebuilder scaffold never declared ports).
    - "liveness-port"                      # Liveness probe port must be container-declared
    - "readiness-port"                     # Readiness probe port must be container-declared
    # ServiceMonitor selectors must resolve to a Service in the lint corpus —
    # label or namespace drift breaks metric scraping silently. Endpoint port
    # names are NOT validated against Service ports in v0.8.3. Clean on the
    # feast module-operator rhoai render.
    - "dangling-servicemonitor"            # ServiceMonitor must resolve to a Service
    - "unset-cpu-requirements"            # Require CPU requests/limits
    - "unset-memory-requirements"         # Require memory requests/limits

    # ===========================================================================
    # NAMESPACE ISOLATION
    # ===========================================================================
    - "use-namespace"                     # CIS 5.7.1, 5.7.4: Don't use default namespace

    # ===========================================================================
    # CONFIGURATION HYGIENE
    # ===========================================================================
    # The API server accepts duplicate env var names within a container; at
    # runtime the last entry silently wins — schema-valid, applyable, quietly
    # wrong (e.g., a Kustomize patch adding an env var the base already sets).
    # Per-container scope (regular + init + ephemeral containers).
    - "duplicate-env-var"                  # No duplicate env var names (last wins)

    # ===========================================================================
    # IMAGE SECURITY
    # ===========================================================================
    - "latest-tag"                        # No 'latest' tag (use immutable tags)

customChecks:
  # Flags ClusterRoleBindings whose subjects include system:* groups
  # (e.g. system:authenticated, system:unauthenticated). Inherited from the
  # attributed baseline; keep unless the consumer has an equivalent check.
  - name: "no-system-group-binding"
    description: "Ensure ClusterRoleBindings do not target system groups"
    remediation: "Remove references to system groups (e.g., system:authenticated, system:unauthenticated) from ClusterRoleBinding subjects"
    template: "cel-expression"
    scope:
      objectKinds:
        - ClusterRoleBinding
    params:
      check: |
        has(object.subjects) && dyn(object.subjects).exists(s, s.kind == "Group" && s.name.startsWith("system:"))
          ? "ClusterRoleBinding references system group"
          : ""
  # Flags ClusterRoleBindings with a ServiceAccount subject that has no
  # namespace. The Kubernetes OpenAPI schema does not require it
  # (Subject requires only kind and name) — the rule lives in API-server
  # validation code, which rejects a ClusterRoleBinding with such a
  # subject on apply. A RoleBinding subject without a namespace is VALID:
  # it defaults to the binding's own namespace, so RoleBindings are out of
  # scope for this check (flagging them would report valid manifests). A
  # namespace-less subject in a checked-in fragment may be deliberate
  # (completed by the consuming Kustomize overlay's namespace transformer)
  # — classify findings against the composition context, and verify by
  # rendering.
  # CEL notes (cel-expression template, v0.8.3): the expression MUST return
  # a string — empty means clean, non-empty is the finding message (a
  # boolean return is a type error that fires on every scoped object); the
  # env types `object` as map(string, any), so comprehensions over object
  # fields require a dyn() cast, as below. The Go→JSON round-trip applies
  # omitempty: the subjects key exists only when non-empty, and an
  # empty-string namespace is omitted — !has(s.namespace) covers both.
  - name: "sa-subject-namespace"
    description: "ServiceAccount subjects in ClusterRoleBindings must have a namespace"
    remediation: "Set subjects[].namespace for ServiceAccount subjects in ClusterRoleBindings, or compose the fragment under an overlay whose namespace transformer fills it"
    template: "cel-expression"
    scope:
      objectKinds:
        - ClusterRoleBinding
    params:
      check: |
        has(object.subjects) && dyn(object.subjects).exists(s, s.kind == "ServiceAccount" && !has(s.namespace))
          ? "ServiceAccount subject is missing its namespace — a ClusterRoleBinding with such a subject is rejected on apply"
          : ""
  # Flags RoleBindings/ClusterRoleBindings whose ServiceAccount subject names
  # an identity no manifest in the lint corpus creates. Such a binding renders
  # and schema-validates cleanly but grants nothing once applied — no builtin
  # check covers binding subjects (non-existent-service-account covers only
  # pod specs). This is the dangling-reference class: it cannot be produced by
  # Kustomize namePrefix/namespace transforms (the NameReference transformer
  # rewrites subjects to the referenced object's final name in every build
  # topology), only by a hardcoded subject that matches nothing — a split
  # build, a post-hoc replacement, or a hand-written reference.
  # The skip-guard (no ServiceAccounts in the corpus at all → silent) keeps
  # platform-managed fragments lintable: identities the platform provides
  # cannot be validated against the corpus. Lint complete rendered deployment
  # profiles for meaningful results. Namespace matching (verified with
  # fixtures against the pinned v0.8.3): an explicit subject namespace must
  # equal the ServiceAccount's namespace; a namespace-less RoleBinding
  # subject matches only the binding's own namespace — the API default — so
  # a same-named account in another namespace does not satisfy it; a
  # namespace-less ClusterRoleBinding subject keeps name-only matching,
  # because such a subject is invalid on apply and sa-subject-namespace
  # reports it separately. A ServiceAccount with no namespace satisfies no
  # explicit subject namespace (the namespace it is applied into is unknown)
  # — conservative: the check fires; classify it in the report.
  # CEL notes: besides the string-return and dyn() rules above, every map
  # access on a possibly-absent key MUST be guarded by has() — a missing-key
  # access is a CEL runtime error, and per the template's semantics an
  # evaluation error fires on EVERY scoped object, not just the offending one.
  - name: "sa-subject-exists"
    description: "ServiceAccount subjects in role bindings must reference a ServiceAccount created by the linted manifests"
    remediation: "Create the ServiceAccount in the same corpus (lint the full rendered deployment profile), fix the subject name or namespace, or remove the subject; platform-provided identities need explicit classification"
    template: "cel-expression"
    scope:
      objectKinds:
        - RoleBinding
        - ClusterRoleBinding
    params:
      check: |
        has(object.subjects)
          && dyn(objects).exists(o, o.kind == "ServiceAccount")
          && dyn(object.subjects).exists(s,
               s.kind == "ServiceAccount"
               && !dyn(objects).exists(o,
                    o.kind == "ServiceAccount"
                    && has(o.metadata)
                    && o.metadata.name == s.name
                    && (has(s.namespace)
                        ? (has(o.metadata.namespace) && o.metadata.namespace == s.namespace)
                        : (object.kind != "RoleBinding"
                           || (has(object.metadata.namespace) && has(o.metadata.namespace) && o.metadata.namespace == object.metadata.namespace)))))
          ? "ServiceAccount subject is not created by any manifest in this lint run — the binding grants nothing unless the identity exists elsewhere (platform-provided identities need classification)"
          : ""
